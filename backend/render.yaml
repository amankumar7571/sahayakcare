# Render free tier — web service, no paid database, no paid add-ons.
# The SQLite file lives on the service's ephemeral disk: data survives
# restarts but resets on redeploy. That is the free-tier trade-off and
# is fine for this demo — the frontend always keeps a local copy too.
services:
  - type: web
    name: sahayakcare-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      # Pin Python 3.12: Render's default 3.14 has no prebuilt wheel for
      # pydantic-core 2.33.0 and building it from source fails (hit 15 Nov).
      - key: PYTHON_VERSION
        value: 3.12.0
      # Production mode: API docs off, auth rate limiting on.
      - key: SAHAYAKCARE_ENV
        value: production
      # CORS is pinned to the deployed frontend origin (never "*"
      # with credentials in production).
      - key: CORS_ALLOW_ORIGINS
        value: "https://stalwart-shortbread-198c2f.netlify.app"
